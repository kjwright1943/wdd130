<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>White Water Rafting Contact Us </title>
    <meta name="description"
      content="Whitewater rafting down some of the rivers in Washington.  Contact us to get information on trips, make web page suggestion, or with general question">
    <meta name="author" content="Kevin Wright">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/white-water-rafting.jpg" alt="White Water Rafting logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <section class="office-location">
            <div class="address">
                <h1>White Water Rafting: Washington</h1>
                <p>5667 Front Ave, Ferndale, WA 98248</p>
                <p>360-555-5555</p>
                <p>wwrwa@outlook.com</p>
            </div>
        </section>

        <div class="contact-split-grid">

            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1312.8294677711112!2d-122.59051946106248!3d48.8456439928326!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x5485bc1456a1eaa3%3A0x3e098ad353a4b38!2s5667%20Front%20Ave%2C%20Ferndale%2C%20WA%2098248!5e0!3m2!1sen!2sus!4v1790651554602!5m2!1sen!2sus"
                  width="600" height="450" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
            <section class="form">
                <h2>Have a question or a suggestion?</h2>
                <form>

                    <div class="form-row">
                        <label for="name">Your Name:</label>
                        <input type="text" id="name" name="name" required>
                        <label for="email">email address:</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <fieldset class="form-row">
                        <!-- <legend class="sr-only">Message Purpose</legend> -->
                        <span class="fieldset-label">Message Purpose</span>
                        <div class="radio-group">
                            <label><input type="radio" id="general" name="purpose"
                                  value="general">General
                                Inquiry</label>
                            <label><input type="radio" id="reservation" name="purpose"
                                  value="reservation">Reservation
                                Question</label>
                            <label><input type="radio" id="suggestion" name="purpose"
                                  value="suggestion">Website
                                suggestion</label>
                        </div>
                    </fieldset>

                    <div class="form-row">
                        <label for="message">Please enter your message:</label>
                        <textarea id="message" name="message" rows="6" required
                          placeholder="How can we help"></textarea>
                    </div>

                    <div class="form">
                        <input type="checkbox" id="subscribe" name="subscribe" value="yes">
                        <label for="subscribe">Please subscribe me to the monthly
                            newsletter.</label>
                    </div>

                    <button type="submit" class="submit-btn">Get in Touch!</button>
                </form>
            </section>
        </div>
        <section class="employee-profiles">
            <h2>Our rafting guides are here to help</h2>
            <div class="quides">
                <figure class="team">
                    <img src="images/kevin.jpg" alt="Kevin Wright">
                    <figcaption>
                        <h3>Kevin Wright</h3>
                        <p>Founder & Logistics</p>
                    </figcaption>
                </figure>

                <figure class="team">
                    <img src="images/skye.jpg" alt="Skye Smith">
                    <figcaption>
                        <h3>Skye Smith</h3>
                        <p>Guid & Customer Service</p>
                    </figcaption>
                </figure>

                <figure class="team">
                    <img src="images/franklin.jpg" alt="Franklin Lott">
                    <figcaption>
                        <h3>Franklin Lott</h3>
                        <p>Guid & Safety Officer</p>
                    </figcaption>
                </figure>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Kevin Wright White Water Rafting: Washington</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.png" alt="facebook logo">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.png" alt="linkedin logo">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.png" alt="Instagram logo">
            </a>
        </nav>
    </footer>
</body>

</html>
